<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para ti 💙</title>

<style>

/* ==================================================
   BASE
================================================== */

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
    overflow-x: hidden;
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 80px 20px;

    overflow-x: hidden;
    overflow-y: auto;

    font-family: Arial, Helvetica, sans-serif;
    color: white;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(50,120,255,.18),
            transparent 32%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(90,40,255,.18),
            transparent 32%
        ),
        linear-gradient(135deg, #07142f, #0a1f4d);

    transition:
        background 1.2s ease;
}


/* ==================================================
   FONDOS POR ZONA
================================================== */

body.zona2 {
    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(40,160,255,.30),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(20,90,255,.25),
            transparent 35%
        ),
        linear-gradient(135deg, #09265c, #104a91);
}

body.zona3 {
    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(150,70,255,.28),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(80,40,200,.25),
            transparent 35%
        ),
        linear-gradient(135deg, #24104f, #4c217e);
}

body.zona4 {
    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255,100,180,.25),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(180,50,150,.22),
            transparent 35%
        ),
        linear-gradient(135deg, #4b174d, #812c69);
}

body.zona5 {
    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255,100,130,.28),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(255,50,100,.25),
            transparent 35%
        ),
        linear-gradient(135deg, #54152e, #8e2348);
}

body.zona6 {
    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(80,130,255,.30),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(170,70,255,.28),
            transparent 35%
        ),
        linear-gradient(135deg, #101d55, #432066);
}


/* ==================================================
   ORBES DE LUZ
================================================== */

.orbe {
    position: fixed;

    width: 280px;
    height: 280px;

    border-radius: 50%;

    background: rgba(100,160,255,.10);

    filter: blur(65px);

    pointer-events: none;

    z-index: 0;

    animation: moverOrbe 14s ease-in-out infinite alternate;
}

.orbe1 {
    top: -100px;
    left: -100px;
}

.orbe2 {
    right: -120px;
    bottom: -120px;

    width: 340px;
    height: 340px;

    animation-delay: -5s;
}

.orbe3 {
    top: 45%;
    left: 45%;

    width: 170px;
    height: 170px;

    opacity: .4;

    animation-duration: 18s;
}

@keyframes moverOrbe {

    0% {
        transform: translate(0,0) scale(1);
    }

    50% {
        transform: translate(35px,-25px) scale(1.1);
    }

    100% {
        transform: translate(-25px,30px) scale(.95);
    }
}


/* ==================================================
   PARTÍCULAS
================================================== */

.particulas {
    position: fixed;
    inset: 0;

    pointer-events: none;

    overflow: hidden;

    z-index: 1;
}

.estrella {
    position: absolute;

    bottom: -15px;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: white;

    opacity: .5;

    box-shadow:
        0 0 6px white,
        0 0 14px rgba(100,170,255,.8);

    animation:
        subir linear infinite,
        parpadear ease-in-out infinite alternate;
}

.estrella.grande {
    width: 5px;
    height: 5px;

    box-shadow:
        0 0 8px white,
        0 0 20px rgba(130,180,255,.9);
}

@keyframes subir {

    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-115vh) translateX(35px);
    }
}

@keyframes parpadear {

    from {
        opacity: .2;
        transform: scale(.7);
    }

    to {
        opacity: .9;
        transform: scale(1.25);
    }
}


/* ==================================================
   PROGRESO
================================================== */

#progreso {
    position: fixed;

    top: 20px;
    right: 22px;

    z-index: 10;

    padding: 7px 12px;

    border-radius: 20px;

    border: 1px solid rgba(255,255,255,.18);

    background: rgba(255,255,255,.06);

    backdrop-filter: blur(10px);

    color: rgba(255,255,255,.65);

    font-size: 11px;

    letter-spacing: 2px;

    transition:
        color .8s ease,
        border-color .8s ease;
}


/* ==================================================
   TARJETA
================================================== */

.inicio {
    position: relative;

    z-index: 2;

    width: min(680px, 100%);

    min-height: 390px;

    flex-shrink: 0;

    padding: 60px 45px;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;

    border-radius: 28px;

    background: rgba(255,255,255,.075);

    border: 1px solid rgba(255,255,255,.16);

    backdrop-filter: blur(18px);

    box-shadow:
        0 25px 80px rgba(0,0,0,.35),
        inset 0 1px 1px rgba(255,255,255,.12);

    overflow: visible;

    animation: entrada .8s ease;
}

.inicio::before {
    content: "";

    position: absolute;

    inset: -2px;

    border-radius: 30px;

    background:
        linear-gradient(
            120deg,
            transparent,
            rgba(255,255,255,.10),
            transparent
        );

    opacity: .4;

    pointer-events: none;

    animation: brillo 6s ease-in-out infinite;
}

@keyframes brillo {

    0%,100% {
        opacity: .15;
        transform: translateX(-25%);
    }

    50% {
        opacity: .55;
        transform: translateX(25%);
    }
}

@keyframes entrada {

    from {
        opacity: 0;
        transform: translateY(20px) scale(.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}


/* ==================================================
   CONTENIDO
================================================== */

#contenido {
    width: 100%;

    position: relative;

    z-index: 2;
}

.aparecer {
    animation: aparecer .75s ease;
}

@keyframes aparecer {

    from {
        opacity: 0;
        transform: translateY(14px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

h1 {
    margin: 0 0 20px;

    font-size: clamp(30px, 6vw, 48px);

    line-height: 1.15;

    text-shadow:
        0 0 20px rgba(100,160,255,.25);
}

p {
    max-width: 560px;

    margin: 0 auto 35px;

    color: rgba(255,255,255,.80);

    font-size: 17px;

    line-height: 1.7;
}


/* ==================================================
   BOTONES
================================================== */

button {
    padding: 14px 27px;

    border: 1px solid rgba(255,255,255,.20);

    border-radius: 999px;

    background: rgba(255,255,255,.13);

    color: white;

    font-size: 15px;

    cursor: pointer;

    box-shadow:
        0 8px 25px rgba(0,0,0,.2);

    transition:
        transform .25s ease,
        background .25s ease,
        box-shadow .25s ease;
}

button:hover {
    transform: translateY(-3px);

    background: rgba(255,255,255,.21);

    box-shadow:
        0 12px 30px rgba(0,0,0,.3),
        0 0 20px rgba(120,180,255,.18);
}

button:active {
    transform: scale(.97);
}


/* ==================================================
   COLORES DEL PROGRESO
================================================== */

body.zona2 #progreso {
    color: #9bd5ff;
}

body.zona3 #progreso {
    color: #d0a7ff;
}

body.zona4 #progreso {
    color: #ffb0df;
}

body.zona5 #progreso {
    color: #ff9fb7;
}

body.zona6 #progreso {
    color: #b7c8ff;
}


/* ==================================================
   DECORACIÓN SUPERIOR
================================================== */

.decoracion-superior {
    position: absolute;

    top: -25px;
    left: 50%;

    transform: translateX(-50%);

    display: flex;
    align-items: center;

    gap: 10px;

    color: rgba(255,255,255,.45);

    font-size: 13px;

    pointer-events: none;
}

.decoracion-superior::before,
.decoracion-superior::after {
    content: "";

    width: 35px;
    height: 1px;

    background: rgba(255,255,255,.25);
}


/* ==================================================
   FINAL
================================================== */

.final-decoracion {
    margin-bottom: 18px;

    font-size: 20px;

    letter-spacing: 10px;

    color: rgba(255,255,255,.55);

    opacity: 0;

    animation:
        aparecerTexto 1.5s ease .4s forwards;
}

.confesion-titulo {
    margin-bottom: 25px;

    font-size: clamp(38px, 8vw, 62px);

    opacity: 0;

    animation:
        aparecerConfesion 1.4s ease forwards;

    text-shadow:
        0 0 25px rgba(150,170,255,.35),
        0 0 60px rgba(180,100,255,.2);
}

.confesion-texto {
    opacity: 0;

    animation:
        aparecerTexto 1.2s ease 1.2s forwards;
}

@keyframes aparecerConfesion {

    from {
        opacity: 0;
        transform: translateY(20px) scale(.95);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes aparecerTexto {

    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* ==================================================
   CORAZONES FINALES
================================================== */

.corazon {
    position: fixed;

    bottom: -30px;

    z-index: 3;

    pointer-events: none;

    opacity: 0;

    animation:
        subirCorazon linear forwards;
}

@keyframes subirCorazon {

    0% {
        opacity: 0;

        transform:
            translateY(0)
            scale(.7)
            rotate(0deg);
    }

    15% {
        opacity: .65;
    }

    80% {
        opacity: .45;
    }

    100% {
        opacity: 0;

        transform:
            translateY(-105vh)
            translateX(30px)
            scale(1.15)
            rotate(15deg);
    }
}


/* ==================================================
   MÓVIL
================================================== */

@media (max-width: 600px) {

    body {
        align-items: flex-start;

        padding:
            80px 15px 60px;
    }

    .inicio {
        width: 100%;

        min-height: 360px;

        padding: 50px 24px;

        border-radius: 24px;
    }

    h1 {
        font-size: 34px;
    }

    p {
        font-size: 15px;

        line-height: 1.65;
    }

    button {
        padding: 13px 23px;
    }

    #progreso {
        top: 14px;
        right: 14px;

        font-size: 10px;
    }

    .decoracion-superior {
        top: -20px;
    }
}

</style>
</head>


<body>

<!-- ==================================================
     ORBES
================================================== -->

<div class="orbe orbe1"></div>
<div class="orbe orbe2"></div>
<div class="orbe orbe3"></div>


<!-- ==================================================
     PARTÍCULAS
================================================== -->

<div class="particulas" id="particulas"></div>


<!-- ==================================================
     PROGRESO
================================================== -->

<div id="progreso">
    01 / 06
</div>


<!-- ==================================================
     TARJETA
================================================== -->

<div class="inicio">

    <div class="decoracion-superior">
        ✦
    </div>

    <div id="contenido">

        <h1>
            Hola jeje
        </h1>

        <p>
            Hice esto porque quería decirte algo...
        </p>

        <button onclick="comenzar()">
            Comenzar 💙
        </button>

    </div>

</div>


<script>

/* ==================================================
   ELEMENTOS
================================================== */

const contenido = document.getElementById("contenido");
const progreso = document.getElementById("progreso");
const particulas = document.getElementById("particulas");


/* ==================================================
   CREAR PARTÍCULAS AUTOMÁTICAMENTE
================================================== */

for (let i = 0; i < 18; i++) {

    const estrella = document.createElement("div");

    estrella.className = "estrella";

    if (Math.random() > .7) {
        estrella.classList.add("grande");
    }

    estrella.style.left =
        Math.random() * 100 + "%";

    estrella.style.animationDuration =
        (9 + Math.random() * 9) + "s";

    estrella.style.animationDelay =
        (-Math.random() * 15) + "s";

    particulas.appendChild(estrella);
}


/* ==================================================
   CAMBIO DE CONTENIDO
================================================== */

function cambiarContenido(html, zona, numero) {

    document.body.className = zona;

    progreso.textContent =
        String(numero).padStart(2, "0") + " / 06";

    contenido.classList.remove("aparecer");

    void contenido.offsetWidth;

    contenido.innerHTML = html;

    contenido.classList.add("aparecer");

    /*
       Si la página estaba desplazada hacia abajo,
       vuelve suavemente al inicio.
    */

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* ==================================================
   ZONA 1 → ZONA 2
================================================== */

function comenzar() {

    cambiarContenido(`

        <h1>
            Bueno... jeje 👀
        </h1>

        <p>
            Antes de seguir, quiero enseñarte algo.
        </p>

        <button onclick="siguiente()">
            Continuar 💙
        </button>

    `, "zona2", 2);
}


/* ==================================================
   ZONA 2 → ZONA 3
================================================== */

function siguiente() {

    cambiarContenido(`

        <h1>
            Hay algo que quiero contarte...
        </h1>

        <p>
            A lo largo de mi vida, y especialmente durante la secundaria,
            siempre fui bastante cerrado a la hora de conocer gente nueva.
            Tenía miedo de volver a salir herido, así que muchas veces
            prefería mantenerme al margen.
            <br><br>

            Aunque tenía amigos, muchas veces me sentía desplazado,
            y poco a poco eso empezó a afectar otras cosas:
            me costaba concentrarme en mis estudios, en mí mismo y,
            en general, disfrutar las cosas como antes.
            <br><br>

            Pero entonces te conocí.
            <br><br>

            No sé si fue obra del destino o simplemente pura suerte,
            pero por alguna razón siempre terminábamos sentados juntos.
            Y, sinceramente, siempre voy a estar agradecido por eso.
            <br><br>

            Creo que una de las mejores partes de mi día es simplemente
            cuando tenemos una pequeña charla, sin importar de qué sea,
            o cuando terminamos jugando algún juego completamente aleatorio.
            Puede parecer algo pequeño, pero cuando estás tú,
            esas cosas se sienten diferentes.
            <br><br>

            Porque no se trata realmente de lo que hacemos.
            <br>
            Se trata de que eres tú.
            <br><br>

            Y supongo que esa es una de las razones por las que estoy
            haciendo todo esto.
            <br><br>

            Porque me importas. Y mucho.
        </p>

        <button onclick="zona4()">
            Continuar 💜
        </button>

    `, "zona3", 3);
}


/* ==================================================
   ZONA 3 → ZONA 4
================================================== */

function zona4() {

    cambiarContenido(`

        <h1>
            Y aunque no recuerde todo...
        </h1>

        <p>
            No voy a mentirte: no recuerdo cada momento que hemos pasado juntos.
            <br><br>

            Podría intentar escoger algún recuerdo y hacer que parezca
            muchísimo más importante de lo que realmente fue,
            pero prefiero ser sincero contigo.
            <br><br>

            Porque lo que sí recuerdo es cómo me sentía cuando estaba contigo.
            <br><br>

            Las pequeñas conversaciones, las veces que terminábamos
            jugando cualquier cosa, las tonterías y esos momentos que
            quizá para alguien más serían completamente normales.
            <br><br>

            Tal vez no pueda recordar cada detalle, pero sí puedo recordar
            que esos momentos llegaron a significar mucho para mí.
            <br><br>

            Y creo que eso dice bastante.
        </p>

        <button onclick="zona5()">
            Continuar 💗
        </button>

    `, "zona4", 4);
}


/* ==================================================
   ZONA 4 → ZONA 5
================================================== */

function zona5() {

    cambiarContenido(`

        <h1>
            Y creo que ya puedes imaginarlo...
        </h1>

        <p>
            Y creo que después de todo lo que te he contado,
            probablemente ya puedas imaginar por dónde va esto...
            <br><br>

            Llevo bastante tiempo pensando en cómo decirlo,
            porque sinceramente no sabía cómo hacerlo.
            No quería simplemente mandarte un mensaje y soltarlo de golpe,
            como si fueran unas palabras cualquiera.
            <br><br>

            Por eso hice todo esto.
            <br><br>

            Quería que antes de llegar a esas palabras pudieras entender
            todo lo que hay detrás de ellas. Cómo eras tú, poco a poco,
            convirtiéndote en alguien tan importante para mí sin que
            siquiera me diera cuenta.
            <br><br>

            Y quizá suene un poco exagerado hacer toda una página para decir
            algo que podría resumirse en unas cuantas palabras...
            <br><br>

            Pero supongo que precisamente esas palabras son demasiado
            importantes para mí como para decirlas sin más.
            <br><br>

            Así que...
            <br><br>

            Ya no quiero seguir dándole vueltas.
        </p>

        <button onclick="confesion()">
            Continuar 💗
        </button>

    `, "zona5", 5);
}


/* ==================================================
   ZONA 5 → ZONA 6
================================================== */

function confesion() {

    cambiarContenido(`

        <div class="final-decoracion">
            ✦ · ✦
        </div>

        <h1>
            Entonces...
        </h1>

        <p>
            Aquí vienen las palabras que tanto me costó decir.
        </p>

        <button onclick="revelar()">
            Continuar 💙
        </button>

    `, "zona6", 6);
}


/* ==================================================
   CONFESIÓN FINAL
================================================== */

function revelar() {

    cambiarContenido(`

        <div class="final-decoracion">
            ✦ · ♡ · ✦
        </div>

        <h1 class="confesion-titulo">
            Me gustas, Jennyfer.
        </h1>

        <p class="confesion-texto">
            Solo quería decírtelo, porque ya no quería seguir guardándomelo.
        </p>

    `, "zona6", 6);

    crearCorazones();
}


/* ==================================================
   CORAZONES
================================================== */

function crearCorazones() {

    const simbolos = ["♡", "♥", "✦"];

    for (let i = 0; i < 12; i++) {

        const corazon = document.createElement("div");

        corazon.className = "corazon";

        corazon.textContent =
            simbolos[
                Math.floor(Math.random() * simbolos.length)
            ];

        corazon.style.left =
            Math.random() * 100 + "%";

        corazon.style.fontSize =
            (12 + Math.random() * 14) + "px";

        corazon.style.animationDuration =
            (7 + Math.random() * 7) + "s";

        corazon.style.animationDelay =
            Math.random() * 4 + "s";

        document.body.appendChild(corazon);

        setTimeout(() => {
            corazon.remove();
        }, 15000);
    }
}

</script>

</body>
</html>
