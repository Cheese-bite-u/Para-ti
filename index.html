<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para ti 💙</title>

<style>

/* =========================
   CONFIGURACIÓN GENERAL
========================= */

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(circle at 20% 20%, rgba(50,120,255,.18), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(90,40,255,.18), transparent 30%),
        linear-gradient(135deg, #07142f, #0a1f4d);

    color: white;

    transition:
        background 1.2s ease,
        filter 1s ease;
}


/* =========================
   FONDOS DE CADA ZONA
========================= */

body.zona2 {
    background:
        radial-gradient(circle at 20% 20%, rgba(40,160,255,.30), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(20,90,255,.25), transparent 35%),
        linear-gradient(135deg, #09265c, #104a91);
}

body.zona3 {
    background:
        radial-gradient(circle at 20% 20%, rgba(150,70,255,.28), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(80,40,200,.25), transparent 35%),
        linear-gradient(135deg, #24104f, #4c217e);
}

body.zona4 {
    background:
        radial-gradient(circle at 20% 20%, rgba(255,100,180,.25), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(180,50,150,.22), transparent 35%),
        linear-gradient(135deg, #4b174d, #812c69);
}

body.zona5 {
    background:
        radial-gradient(circle at 20% 20%, rgba(255,100,130,.28), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(255,50,100,.25), transparent 35%),
        linear-gradient(135deg, #54152e, #8e2348);
}

body.zona6 {
    background:
        radial-gradient(circle at 20% 20%, rgba(80,130,255,.30), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(170,70,255,.28), transparent 35%),
        linear-gradient(135deg, #101d55, #432066);
}


/* =========================
   ORBES DE LUZ
========================= */

.orbe {
    position: fixed;
    width: 300px;
    height: 300px;

    border-radius: 50%;

    background: rgba(90, 150, 255, .12);

    filter: blur(60px);

    pointer-events: none;

    animation: moverOrbe 12s ease-in-out infinite alternate;
}

.orbe1 {
    top: -100px;
    left: -80px;
}

.orbe2 {
    bottom: -120px;
    right: -80px;

    width: 350px;
    height: 350px;

    animation-delay: -5s;
}

.orbe3 {
    top: 40%;
    left: 45%;

    width: 180px;
    height: 180px;

    opacity: .45;

    animation-duration: 16s;
}

@keyframes moverOrbe {

    0% {
        transform: translate(0, 0) scale(1);
    }

    50% {
        transform: translate(40px, -25px) scale(1.12);
    }

    100% {
        transform: translate(-30px, 35px) scale(.95);
    }
}


/* =========================
   PARTÍCULAS
========================= */

.estrella {
    position: fixed;

    bottom: -20px;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: white;

    opacity: .6;

    pointer-events: none;

    box-shadow:
        0 0 6px rgba(255,255,255,.8),
        0 0 14px rgba(100,170,255,.7);

    animation:
        flotar linear infinite,
        parpadear ease-in-out infinite alternate;
}

.estrella.pequena {
    width: 2px;
    height: 2px;
}

.estrella.mediana {
    width: 4px;
    height: 4px;
}

.estrella.grande {
    width: 6px;
    height: 6px;

    box-shadow:
        0 0 8px white,
        0 0 20px rgba(120,180,255,.9);
}

@keyframes flotar {

    from {
        transform: translateY(0) translateX(0);
    }

    to {
        transform: translateY(-110vh) translateX(35px);
    }
}

@keyframes parpadear {

    from {
        opacity: .25;
        transform: scale(.7);
    }

    to {
        opacity: .9;
        transform: scale(1.3);
    }
}


/* =========================
   INDICADOR DE PROGRESO
========================= */

#progreso {
    position: fixed;

    top: 22px;
    right: 25px;

    z-index: 20;

    padding: 7px 12px;

    border: 1px solid rgba(255,255,255,.18);

    border-radius: 20px;

    background: rgba(255,255,255,.06);

    backdrop-filter: blur(10px);

    color: rgba(255,255,255,.65);

    font-size: 12px;
    letter-spacing: 2px;

    transition:
        color .8s ease,
        border .8s ease;
}


/* =========================
   DECORACIÓN SUPERIOR
========================= */

.decoracion-superior {
    position: absolute;

    top: -22px;
    left: 50%;

    transform: translateX(-50%);

    display: flex;
    align-items: center;
    gap: 10px;

    color: rgba(255,255,255,.45);

    font-size: 13px;

    pointer-events: none;
}

.decoracion-superior::before,
.decoracion-superior::after {
    content: "";

    width: 35px;
    height: 1px;

    background: rgba(255,255,255,.25);
}


/* =========================
   TARJETA PRINCIPAL
========================= */

.inicio {
    position: relative;

    width: min(90%, 680px);

    min-height: 390px;

    padding: 55px 45px;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    border-radius: 28px;

    background: rgba(255,255,255,.075);

    border: 1px solid rgba(255,255,255,.16);

    backdrop-filter: blur(18px);

    box-shadow:
        0 25px 80px rgba(0,0,0,.35),
        inset 0 1px 1px rgba(255,255,255,.12);

    overflow: visible;

    animation: entrada .9s ease;
}


/* brillo alrededor de la tarjeta */

.inicio::before {
    content: "";

    position: absolute;

    inset: -2px;

    border-radius: 30px;

    background:
        linear-gradient(
            120deg,
            transparent,
            rgba(255,255,255,.10),
            transparent
        );

    opacity: .5;

    pointer-events: none;

    animation: brilloTarjeta 5s ease-in-out infinite;
}

@keyframes brilloTarjeta {

    0%,100% {
        opacity: .2;
        transform: translateX(-20%);
    }

    50% {
        opacity: .6;
        transform: translateX(20%);
    }
}


/* =========================
   TEXTO
========================= */

h1 {
    margin: 0 0 18px;

    font-size: clamp(30px, 6vw, 48px);

    font-weight: 700;

    letter-spacing: -.5px;

    text-shadow:
        0 0 20px rgba(100,160,255,.25);
}

p {
    max-width: 540px;

    margin: 0 0 35px;

    color: rgba(255,255,255,.78);

    font-size: 17px;

    line-height: 1.7;
}


/* =========================
   BOTÓN
========================= */

button {
    border: none;

    padding: 14px 27px;

    border-radius: 999px;

    background: rgba(255,255,255,.13);

    color: white;

    font-size: 15px;

    cursor: pointer;

    border: 1px solid rgba(255,255,255,.2);

    box-shadow:
        0 8px 25px rgba(0,0,0,.2);

    transition:
        transform .25s ease,
        background .25s ease,
        box-shadow .25s ease;
}

button:hover {
    transform: translateY(-3px);

    background: rgba(255,255,255,.21);

    box-shadow:
        0 12px 30px rgba(0,0,0,.3),
        0 0 20px rgba(120,180,255,.18);
}

button:active {
    transform: translateY(0) scale(.97);
}


/* =========================
   ANIMACIÓN DE CAMBIO
========================= */

.aparecer {
    animation: aparecer .8s ease;
}

@keyframes aparecer {

    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes entrada {

    from {
        opacity: 0;
        transform: translateY(25px) scale(.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}


/* =========================
   COLORES DEL PROGRESO
========================= */

body.zona2 #progreso {
    color: #9bd5ff;
}

body.zona3 #progreso {
    color: #d0a7ff;
}

body.zona4 #progreso {
    color: #ffb0df;
}

body.zona5 #progreso {
    color: #ff9fb7;
}

body.zona6 #progreso {
    color: #b7c8ff;
}


/* =========================
   CONFESIÓN FINAL
========================= */

.confesion-titulo {
    font-size: clamp(38px, 8vw, 62px);

    margin-bottom: 25px;

    opacity: 0;

    animation:
        aparecerConfesion 1.4s ease forwards;

    text-shadow:
        0 0 25px rgba(150,170,255,.35),
        0 0 60px rgba(180,100,255,.2);
}

.confesion-texto {
    opacity: 0;

    animation:
        aparecerTexto 1.2s ease 1.2s forwards;
}

@keyframes aparecerConfesion {

    from {
        opacity: 0;
        transform: translateY(20px) scale(.95);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes aparecerTexto {

    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================
   CORAZONES FINALES
========================= */

.corazon {
    position: fixed;

    bottom: -30px;

    font-size: 18px;

    opacity: 0;

    pointer-events: none;

    animation: subirCorazon linear forwards;
}

@keyframes subirCorazon {

    0% {
        opacity: 0;
        transform: translateY(0) scale(.7) rotate(0deg);
    }

    15% {
        opacity: .65;
    }

    80% {
        opacity: .45;
    }

    100% {
        opacity: 0;
        transform:
            translateY(-105vh)
            translateX(30px)
            scale(1.15)
            rotate(15deg);
    }
}


/* =========================
   DETALLE FINAL
========================= */

.final-decoracion {
    margin-bottom: 18px;

    font-size: 20px;

    letter-spacing: 12px;

    color: rgba(255,255,255,.55);

    animation:
        aparecerTexto 1.5s ease .5s forwards;

    opacity: 0;
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 600px) {

    .inicio {
        width: 90%;

        min-height: 360px;

        padding: 45px 25px;

        border-radius: 24px;
    }

    h1 {
        font-size: 34px;
    }

    p {
        font-size: 15px;
        line-height: 1.65;
    }

    button {
        padding: 13px 23px;
    }

    #progreso {
        top: 15px;
        right: 15px;

        font-size: 10px;
    }

    .decoracion-superior {
        top: -20px;
    }
}

</style>
</head>


<body>

<!-- =========================
     ORBES
========================= -->

<div class="orbe orbe1"></div>
<div class="orbe orbe2"></div>
<div class="orbe orbe3"></div>


<!-- =========================
     PARTÍCULAS
========================= -->

<div class="estrella pequena"
     style="left:8%; animation-duration:9s; animation-delay:0s;"></div>

<div class="estrella mediana"
     style="left:17%; animation-duration:12s; animation-delay:2s;"></div>

<div class="estrella grande"
     style="left:28%; animation-duration:10s; animation-delay:4s;"></div>

<div class="estrella pequena"
     style="left:38%; animation-duration:14s; animation-delay:1s;"></div>

<div class="estrella mediana"
     style="left:49%; animation-duration:11s; animation-delay:3s;"></div>

<div class="estrella grande"
     style="left:61%; animation-duration:13s; animation-delay:5s;"></div>

<div class="estrella pequena"
     style="left:72%; animation-duration:10s; animation-delay:1s;"></div>

<div class="estrella mediana"
     style="left:83%; animation-duration:15s; animation-delay:4s;"></div>

<div class="estrella grande"
     style="left:93%; animation-duration:12s; animation-delay:2s;"></div>

<div class="estrella pequena"
     style="left:13%; animation-duration:16s; animation-delay:7s;"></div>

<div class="estrella pequena"
     style="left:57%; animation-duration:13s; animation-delay:8s;"></div>

<div class="estrella mediana"
     style="left:76%; animation-duration:17s; animation-delay:6s;"></div>


<!-- =========================
     PROGRESO
========================= -->

<div id="progreso">
    01 / 06
</div>


<!-- =========================
     TARJETA
========================= -->

<div class="inicio" id="pantalla">

    <div class="decoracion-superior">
        ✦
    </div>

    <div id="contenido">

        <h1>Hola jeje</h1>

        <p>
            Hice esto porque quería decirte algo...
        </p>

        <button onclick="comenzar()">
            Comenzar 💙
        </button>

    </div>

</div>


<script>

/* =========================
   REFERENCIAS
========================= */

const pantalla = document.getElementById("pantalla");
const contenido = document.getElementById("contenido");
const progreso = document.getElementById("progreso");


/* =========================
   ANIMACIÓN DE PANTALLA
========================= */

function animarPantalla() {

    contenido.classList.remove("aparecer");

    void contenido.offsetWidth;

    contenido.classList.add("aparecer");
}


/* =========================
   ACTUALIZAR PROGRESO
========================= */

function actualizarProgreso(numero) {

    progreso.textContent =
        String(numero).padStart(2, "0") + " / 06";
}


/* =========================
   ZONA 1 → ZONA 2
========================= */

function comenzar() {

    document.body.className = "zona2";

    actualizarProgreso(2);

    contenido.innerHTML = `

        <h1>Bueno... jeje 👀</h1>

        <p>
            Antes de seguir, quiero enseñarte algo.
        </p>

        <button onclick="siguiente()">
            Continuar 💙
        </button>

    `;

    animarPantalla();
}


/* =========================
   ZONA 2 → ZONA 3
========================= */

function siguiente() {

    document.body.className = "zona3";

    actualizarProgreso(3);

    contenido.innerHTML = `

        <h1>Hay algo que quiero contarte...</h1>

        <p>
            A lo largo de mi vida, y especialmente durante la secundaria,
            siempre fui bastante cerrado a la hora de conocer gente nueva.
            Tenía miedo de volver a salir herido, así que muchas veces
            prefería mantenerme al margen.
            <br><br>

            Aunque tenía amigos, muchas veces me sentía desplazado,
            y poco a poco eso empezó a afectar otras cosas:
            me costaba concentrarme en mis estudios, en mí mismo y,
            en general, disfrutar las cosas como antes.
            <br><br>

            Pero entonces te conocí.
            <br><br>

            No sé si fue obra del destino o simplemente pura suerte,
            pero por alguna razón siempre terminábamos sentados juntos.
            Y, sinceramente, siempre voy a estar agradecido por eso.
            <br><br>

            Creo que una de las mejores partes de mi día es simplemente
            cuando tenemos una pequeña charla, sin importar de qué sea,
            o cuando terminamos jugando algún juego completamente aleatorio.
            Puede parecer algo pequeño, pero cuando estás tú,
            esas cosas se sienten diferentes.
            <br><br>

            Porque no se trata realmente de lo que hacemos.
            <br>
            Se trata de que eres tú.
            <br><br>

            Y supongo que esa es una de las razones por las que estoy
            haciendo todo esto.
            <br><br>

            Porque me importas. Y mucho.
        </p>

        <button onclick="zona4()">
            Continuar 💜
        </button>

    `;

    animarPantalla();
}


/* =========================
   ZONA 3 → ZONA 4
========================= */

function zona4() {

    document.body.className = "zona4";

    actualizarProgreso(4);

    contenido.innerHTML = `

        <h1>Y aunque no recuerde todo...</h1>

        <p>
            No voy a mentirte: no recuerdo cada momento que hemos pasado juntos.
            <br><br>

            Podría intentar escoger algún recuerdo y hacer que parezca
            muchísimo más importante de lo que realmente fue,
            pero prefiero ser sincero contigo.
            <br><br>

            Porque lo que sí recuerdo es cómo me sentía cuando estaba contigo.
            <br><br>

            Las pequeñas conversaciones, las veces que terminábamos
            jugando cualquier cosa, las tonterías y esos momentos que
            quizá para alguien más serían completamente normales.
            <br><br>

            Tal vez no pueda recordar cada detalle, pero sí puedo recordar
            que esos momentos llegaron a significar mucho para mí.
            <br><br>

            Y creo que eso dice bastante.
        </p>

        <button onclick="zona5()">
            Continuar 💗
        </button>

    `;

    animarPantalla();
}


/* =========================
   ZONA 4 → ZONA 5
========================= */

function zona5() {

    document.body.className = "zona5";

    actualizarProgreso(5);

    contenido.innerHTML = `

        <h1>Y creo que ya puedes imaginarlo...</h1>

        <p>
            Y creo que después de todo lo que te he contado,
            probablemente ya puedas imaginar por dónde va esto...
            <br><br>

            Llevo bastante tiempo pensando en cómo decirlo,
            porque sinceramente no sabía cómo hacerlo.
            No quería simplemente mandarte un mensaje y soltarlo de golpe,
            como si fueran unas palabras cualquiera.
            <br><br>

            Por eso hice todo esto.
            <br><br>

            Quería que antes de llegar a esas palabras pudieras entender
            todo lo que hay detrás de ellas. Cómo eras tú, poco a poco,
            convirtiéndote en alguien tan importante para mí sin que
            siquiera me diera cuenta.
            <br><br>

            Y quizá suene un poco exagerado hacer toda una página para decir
            algo que podría resumirse en unas cuantas palabras...
            <br><br>

            Pero supongo que precisamente esas palabras son demasiado
            importantes para mí como para decirlas sin más.
            <br><br>

            Así que...
            <br><br>

            Ya no quiero seguir dándole vueltas.
        </p>

        <button onclick="confesion()">
            Continuar 💗
        </button>

    `;

    animarPantalla();
}


/* =========================
   ZONA 5 → ZONA 6
========================= */

function confesion() {

    document.body.className = "zona6";

    actualizarProgreso(6);

    contenido.innerHTML = `

        <div class="final-decoracion">
            ✦ · ✦
        </div>

        <h1>
            Entonces...
        </h1>

        <p>
            Aquí vienen las palabras que tanto me costó decir.
        </p>

        <button onclick="revelar()">
            Continuar 💙
        </button>

    `;

    animarPantalla();
}


/* =========================
   CONFESIÓN FINAL
========================= */

function revelar() {

    actualizarProgreso(6);

    contenido.innerHTML = `

        <div class="final-decoracion">
            ✦ · ♡ · ✦
        </div>

        <h1 class="confesion-titulo">
            Me gustas, Jennyfer.
        </h1>

        <p class="confesion-texto">
            Solo quería decírtelo, porque ya no quería seguir guardándomelo.
        </p>

    `;

    animarPantalla();

    crearCorazones();
}


/* =========================
   CORAZONES FINALES
========================= */

function crearCorazones() {

    const simbolos = ["♡", "♥", "✦"];

    for (let i = 0; i < 12; i++) {

        const corazon = document.createElement("div");

        corazon.classList.add("corazon");

        corazon.textContent =
            simbolos[Math.floor(Math.random() * simbolos.length)];

        corazon.style.left =
            Math.random() * 100 + "%";

        corazon.style.fontSize =
            (12 + Math.random() * 14) + "px";

        corazon.style.animationDuration =
            (7 + Math.random() * 7) + "s";

        corazon.style.animationDelay =
            Math.random() * 4 + "s";

        document.body.appendChild(corazon);

        setTimeout(() => {

            corazon.remove();

        }, 15000);
    }
}

</script>

</body>
</html>
