<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para ti 💙</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            color: white;
            text-align: center;

            overflow: hidden;

            background:
                radial-gradient(circle at 20% 20%, #243b73 0%, transparent 35%),
                radial-gradient(circle at 80% 80%, #182e5c 0%, transparent 35%),
                linear-gradient(135deg, #0b1228, #10182f, #0a1125);

            transition: background 1.5s ease;
        }

        /* =========================================
           BRILLOS DEL FONDO
        ========================================= */

        body::before,
        body::after {
            content: "";
            position: fixed;

            width: 300px;
            height: 300px;

            border-radius: 50%;
            filter: blur(80px);

            opacity: 0.25;
            pointer-events: none;

            transition:
                background 1.5s ease,
                opacity 1.5s ease;
        }

        body::before {
            background: #4d7cff;
            top: -100px;
            left: -100px;
        }

        body::after {
            background: #2766ff;
            bottom: -100px;
            right: -100px;
        }

        /* =========================================
           TARJETA PRINCIPAL
        ========================================= */

        .inicio {
            position: relative;
            z-index: 1;

            width: min(90%, 700px);
            max-height: 85vh;

            padding: 50px 40px;

            background: rgba(255, 255, 255, 0.07);

            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 30px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35),
                0 0 40px rgba(68, 111, 255, 0.08);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            overflow-y: auto;

            animation: aparecer 0.8s ease;

            transition:
                box-shadow 1.5s ease,
                border-color 1.5s ease;
        }

        /* =========================================
           TEXTO
        ========================================= */

        h1 {
            font-size: clamp(35px, 7vw, 55px);

            margin: 0 0 18px;

            text-shadow:
                0 0 10px rgba(120, 160, 255, 0.35),
                0 0 25px rgba(80, 120, 255, 0.15);

            transition: text-shadow 1.5s ease;
        }

        p {
            font-size: clamp(18px, 4vw, 21px);
            line-height: 1.7;

            margin: 0;

            opacity: 0.88;
        }

        /* =========================================
           BOTONES
        ========================================= */

        button {
            margin-top: 30px;

            padding: 15px 34px;

            border: none;
            border-radius: 999px;

            font-size: 18px;
            font-weight: bold;

            color: white;

            background: linear-gradient(
                135deg,
                #4d7cff,
                #2f5bea
            );

            box-shadow:
                0 8px 20px rgba(45, 91, 234, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease,
                background 1.5s ease;
        }

        button:hover {
            transform: translateY(-3px) scale(1.03);

            box-shadow:
                0 12px 28px rgba(45, 91, 234, 0.5),
                0 0 20px rgba(77, 124, 255, 0.25);

            filter: brightness(1.08);
        }

        button:active {
            transform: translateY(0) scale(0.98);
        }

        /* =========================================
           PARTÍCULAS
        ========================================= */

        .estrella {
            position: fixed;

            width: 4px;
            height: 4px;

            background: white;

            border-radius: 50%;

            opacity: 0.5;

            animation: flotar linear infinite;

            pointer-events: none;
        }

        @keyframes flotar {
            from {
                transform: translateY(0);
                opacity: 0;
            }

            20% {
                opacity: 0.5;
            }

            80% {
                opacity: 0.5;
            }

            to {
                transform: translateY(-100vh);
                opacity: 0;
            }
        }

        /* =========================================
           ANIMACIÓN DE ENTRADA
        ========================================= */

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* =========================================
           ZONA 2 - AZUL
        ========================================= */

        body.zona2 {
            background:
                radial-gradient(circle at 15% 20%, #3458a8 0%, transparent 35%),
                radial-gradient(circle at 85% 80%, #273c88 0%, transparent 35%),
                linear-gradient(135deg, #101a3a, #18275a, #101737);
        }

        body.zona2::before {
            background: #547cff;
        }

        body.zona2::after {
            background: #5969ff;
        }

        body.zona2 .inicio {
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35),
                0 0 50px rgba(84, 124, 255, 0.16);

            border-color: rgba(120, 145, 255, 0.2);
        }

        /* =========================================
           ZONA 3 - MORADO
        ========================================= */

        body.zona3 {
            background:
                radial-gradient(circle at 15% 20%, #64478b 0%, transparent 35%),
                radial-gradient(circle at 85% 80%, #4a316f 0%, transparent 35%),
                linear-gradient(135deg, #19132c, #24163b, #171125);
        }

        body.zona3::before {
            background: #9b68d1;
            opacity: 0.22;
        }

        body.zona3::after {
            background: #7442b8;
            opacity: 0.22;
        }

        body.zona3 .inicio {
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.38),
                0 0 60px rgba(144, 92, 198, 0.16);

            border-color: rgba(185, 140, 225, 0.18);
        }

        body.zona3 h1 {
            text-shadow:
                0 0 12px rgba(193, 151, 235, 0.35),
                0 0 30px rgba(157, 104, 209, 0.18);
        }

        body.zona3 button {
            background:
                linear-gradient(
                    135deg,
                    #9763cf,
                    #7040ae
                );

            box-shadow:
                0 8px 20px rgba(112, 64, 174, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        /* =========================================
           ZONA 4 - ROSA
        ========================================= */

        body.zona4 {
            background:
                radial-gradient(circle at 15% 20%, #8d4f72 0%, transparent 35%),
                radial-gradient(circle at 85% 80%, #743b63 0%, transparent 35%),
                linear-gradient(135deg, #2a1524, #3a1b31, #24121f);
        }

        body.zona4::before {
            background: #d477a6;
            opacity: 0.20;
        }

        body.zona4::after {
            background: #b64f88;
            opacity: 0.20;
        }

        body.zona4 .inicio {
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.4),
                0 0 65px rgba(205, 100, 155, 0.16);

            border-color: rgba(235, 150, 190, 0.18);
        }

        body.zona4 h1 {
            text-shadow:
                0 0 12px rgba(242, 171, 205, 0.35),
                0 0 30px rgba(215, 119, 166, 0.2);
        }

        body.zona4 button {
            background:
                linear-gradient(
                    135deg,
                    #d06d9f,
                    #a84d7c
                );

            box-shadow:
                0 8px 20px rgba(168, 77, 124, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        /* =========================================
           ZONA 5 - ROSA / ROJO
        ========================================= */

        body.zona5 {
            background:
                radial-gradient(circle at 15% 20%, #b55b78 0%, transparent 35%),
                radial-gradient(circle at 85% 80%, #8f3d62 0%, transparent 35%),
                linear-gradient(135deg, #32141f, #491827, #2b101b);
        }

        body.zona5::before {
            background: #f080a4;
            opacity: 0.23;
        }

        body.zona5::after {
            background: #d94e7d;
            opacity: 0.23;
        }

        body.zona5 .inicio {
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.42),
                0 0 70px rgba(225, 87, 132, 0.18);

            border-color: rgba(245, 155, 185, 0.2);
        }

        body.zona5 h1 {
            text-shadow:
                0 0 12px rgba(255, 184, 205, 0.4),
                0 0 32px rgba(232, 103, 145, 0.22);
        }

        body.zona5 button {
            background:
                linear-gradient(
                    135deg,
                    #e26b94,
                    #c64d76
                );

            box-shadow:
                0 8px 22px rgba(198, 77, 118, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        /* =========================================
           ZONA 6 - CONFESIÓN
           
           La dejamos preparada con una mezcla
           de azul y rosa para que se sienta
           diferente a todas las anteriores.
        ========================================= */

        body.zona6 {
            background:
                radial-gradient(circle at 15% 20%, #5b70c4 0%, transparent 35%),
                radial-gradient(circle at 85% 80%, #a75391 0%, transparent 35%),
                linear-gradient(135deg, #1a1838, #322040, #24152f);
        }

        body.zona6::before {
            background: #718cff;
            opacity: 0.22;
        }

        body.zona6::after {
            background: #d06aad;
            opacity: 0.22;
        }

        body.zona6 .inicio {
            box-shadow:
                0 20px 55px rgba(0, 0, 0, 0.4),
                0 0 80px rgba(181, 112, 218, 0.22);

            border-color: rgba(220, 169, 240, 0.22);
        }

        body.zona6 h1 {
            text-shadow:
                0 0 15px rgba(210, 190, 255, 0.4),
                0 0 35px rgba(194, 118, 224, 0.22);
        }

        body.zona6 button {
            background:
                linear-gradient(
                    135deg,
                    #7770d9,
                    #b05aa8
                );

            box-shadow:
                0 8px 24px rgba(151, 96, 199, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        /* =========================================
           CELULAR
        ========================================= */

        @media (max-width: 600px) {

            .inicio {
                width: 92%;
                padding: 40px 25px;
                max-height: 88vh;
            }

            p {
                line-height: 1.6;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>


<body>

    <!-- =========================================
         PARTÍCULAS
    ========================================= -->

    <div class="estrella" style="left: 10%; bottom: -10px; animation-duration: 8s;"></div>
    <div class="estrella" style="left: 25%; bottom: -10px; animation-duration: 11s; animation-delay: 2s;"></div>
    <div class="estrella" style="left: 40%; bottom: -10px; animation-duration: 9s; animation-delay: 4s;"></div>
    <div class="estrella" style="left: 55%; bottom: -10px; animation-duration: 12s; animation-delay: 1s;"></div>
    <div class="estrella" style="left: 70%; bottom: -10px; animation-duration: 10s; animation-delay: 3s;"></div>
    <div class="estrella" style="left: 85%; bottom: -10px; animation-duration: 13s; animation-delay: 5s;"></div>


    <!-- =========================================
         CONTENIDO
    ========================================= -->

    <div class="inicio">

        <h1>
            Hola jeje
        </h1>

        <p>
            Hice esto porque quería decirte algo...
        </p>

        <button onclick="comenzar()">
            Comenzar 💙
        </button>

    </div>


    <script>

        /* =========================================
           REINICIAR ANIMACIÓN
        ========================================= */

        function animarPantalla() {

            const inicio = document.querySelector(".inicio");

            inicio.style.animation = "none";

            /*
                Obliga al navegador a reiniciar
                la animación.
            */
            inicio.offsetHeight;

            inicio.style.animation = "aparecer 0.8s ease";
        }


        /* =========================================
           ZONA 1 → ZONA 2
        ========================================= */

        function comenzar() {

            const inicio = document.querySelector(".inicio");

            document.body.className = "zona2";

            inicio.innerHTML = `

                <h1>
                    Bueno... jeje 👀
                </h1>

                <p>
                    Antes de seguir, quiero enseñarte algo.
                </p>

                <button onclick="siguiente()">
                    Continuar 💙
                </button>

            `;

            animarPantalla();
        }


        /* =========================================
           ZONA 2 → ZONA 3
        ========================================= */

        function siguiente() {

            const inicio = document.querySelector(".inicio");

            document.body.className = "zona3";

            inicio.innerHTML = `

                <h1>
                    Hay algo que quiero contarte...
                </h1>

                <p>

                    A lo largo de mi vida, y especialmente durante la secundaria,
                    siempre fui bastante cerrado a la hora de conocer gente nueva.
                    Tenía miedo de volver a salir herido, así que muchas veces
                    prefería mantenerme al margen.

                    <br><br>

                    Aunque tenía amigos, muchas veces me sentía desplazado,
                    y poco a poco eso empezó a afectar otras cosas:
                    me costaba concentrarme en mis estudios, en mí mismo y,
                    en general, disfrutar las cosas como antes.

                    <br><br>

                    Pero entonces te conocí.

                    <br><br>

                    No sé si fue obra del destino o simplemente pura suerte,
                    pero por alguna razón siempre terminábamos sentados juntos.
                    Y, sinceramente, siempre voy a estar agradecido por eso.

                    <br><br>

                    Creo que una de las mejores partes de mi día es simplemente
                    cuando tenemos una pequeña charla, sin importar de qué sea,
                    o cuando terminamos jugando algún juego completamente aleatorio.
                    Puede parecer algo pequeño, pero cuando estás tú,
                    esas cosas se sienten diferentes.

                    <br><br>

                    Porque no se trata realmente de lo que hacemos.

                    <br>

                    Se trata de que eres tú.

                    <br><br>

                    Y supongo que esa es una de las razones por las que estoy
                    haciendo todo esto.

                    <br><br>

                    Porque me importas. Y mucho.

                </p>

                <button onclick="zona4()">
                    Continuar 💜
                </button>

            `;

            animarPantalla();
        }


        /* =========================================
           ZONA 3 → ZONA 4
        ========================================= */

        function zona4() {

            const inicio = document.querySelector(".inicio");

            document.body.className = "zona4";

            inicio.innerHTML = `

                <h1>
                    Y aunque no recuerde todo...
                </h1>

                <p>

                    No voy a mentirte: no recuerdo cada momento que hemos
                    pasado juntos.

                    <br><br>

                    Podría intentar escoger algún recuerdo y hacer que parezca
                    muchísimo más importante de lo que realmente fue,
                    pero prefiero ser sincero contigo.

                    <br><br>

                    Porque lo que sí recuerdo es cómo me sentía cuando estaba
                    contigo.

                    <br><br>

                    Las pequeñas conversaciones, las veces que terminábamos
                    jugando cualquier cosa, las tonterías y esos momentos que
                    quizá para alguien más serían completamente normales.

                    <br><br>

                    Tal vez no pueda recordar cada detalle, pero sí puedo
                    recordar que esos momentos llegaron a significar mucho
                    para mí.

                    <br><br>

                    Y creo que eso dice bastante.

                </p>

                <button onclick="zona5()">
                    Continuar 💗
                </button>

            `;

            animarPantalla();
        }


        /* =========================================
           ZONA 4 → ZONA 5
        ========================================= */

        function zona5() {

            const inicio = document.querySelector(".inicio");

            document.body.className = "zona5";

            inicio.innerHTML = `

                <h1>
                    Y creo que ya puedes imaginarlo...
                </h1>

                <p>

                    Y creo que después de todo lo que te he contado,
                    probablemente ya puedas imaginar por dónde va esto...

                    <br><br>

                    Llevo bastante tiempo pensando en cómo decirlo,
                    porque sinceramente no sabía cómo hacerlo.

                    No quería simplemente mandarte un mensaje y soltarlo
                    de golpe, como si fueran unas palabras cualquiera.

                    <br><br>

                    Por eso hice todo esto.

                    <br><br>

                    Quería que antes de llegar a esas palabras pudieras
                    entender todo lo que hay detrás de ellas.

                    Cómo eras tú, poco a poco, convirtiéndote en alguien
                    tan importante para mí sin que siquiera me diera cuenta.

                    <br><br>

                    Y quizá suene un poco exagerado hacer toda una página
                    para decir algo que podría resumirse en unas cuantas
                    palabras...

                    <br><br>

                    Pero supongo que precisamente esas palabras son
                    demasiado importantes para mí como para decirlas sin más.

                    <br><br>

                    Así que...

                    <br><br>

                    Ya no quiero seguir dándole vueltas.

                </p>

                <button onclick="confesion()">
                    Continuar 💗
                </button>

            `;

            animarPantalla();
        }


        /* =========================================
           ZONA 5 → ZONA 6
           
           LA CONFESIÓN TODAVÍA ESTÁ PREPARADA,
           PERO NO LE PONEMOS EL TEXTO FINAL
           HASTA QUE LO ESCRIBAMOS.
        ========================================= */

        function confesion() {

            const inicio = document.querySelector(".inicio");

            document.body.className = "zona6";

            inicio.innerHTML = `

                <h1>
                    Entonces...
                </h1>

                <p>
                    Aquí vienen las palabras que tanto
                    me costó decir.
                </p>

                <button onclick="revelar()">
                    Continuar 💙
                </button>

            `;

            animarPantalla();
        }


        /* =========================================
           PANTALLA PARA LA CONFESIÓN FINAL
        ========================================= */

        function revelar() {

            const inicio = document.querySelector(".inicio");

            inicio.innerHTML = `

                <h1>
                    💙
                </h1>

                <p>
                    Aquí irá la confesión final.
                </p>

            `;

            animarPantalla();
        }

    </script>

</body>
</html>
